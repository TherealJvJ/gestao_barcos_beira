{% extends 'base.html' %}
{% block titulo %}Registar Manutenção{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header-custom"><div class="header-left"><i class="bi bi-tools"></i> Registar Manutenção</div></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Embarcação</label>
                        {{ form.embarcacao }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        {{ form.descricao }}
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Data</label>
                            {{ form.data_manutencao }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Custo (MZN)</label>
                            {{ form.custo }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Manutenção</label>
                        {{ form.tipo_manutencao }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Observações</label>
                        {{ form.observacoes }}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-oceano">Registar</button>
                        <a href="{% url 'redirecionar_dashboard' %}" class="btn-outline-oceano">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
