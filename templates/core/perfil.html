{% extends 'base.html' %}
{% block titulo %}Meu Perfil{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header-custom"><div class="header-left"><i class="bi bi-person-gear"></i> Meu Perfil</div></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        {{ form.nome_completo }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail (Gmail)</label>
                        {{ form.email }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone (+258)</label>
                        {{ form.telefone }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Nº Documento (BI/NUIT)</label>
                        {{ form.numero_documento }}
                    </div>

                    <button type="submit" class="btn-oceano">Guardar Alterações</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
