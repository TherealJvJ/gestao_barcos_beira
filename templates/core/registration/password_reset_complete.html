{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Senha Redefinida — INTRANSMAR Beira">
    <title>Senha Redefinida — INTRANSMAR</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230A6B8A'/><path d='M20 65 L50 30 L80 65 Z' fill='white' opacity='.9'/><rect x='45' y='60' width='10' height='20' fill='white' opacity='.7'/><path d='M15 70 Q50 80 85 70' stroke='white' stroke-width='5' fill='none' opacity='.8'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body style="background:var(--bg-app);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;">

<div style="width:100%;max-width:480px;">
    <!-- Cabeçalho -->
    <div style="text-align:center;margin-bottom:28px;">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#2A9D6F,#3EB885);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 16px rgba(42,157,111,0.35);">
            <i class="bi bi-patch-check" style="font-size:28px;color:white;"></i>
        </div>
        <h1 style="font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;">INTRANSMAR</h1>
        <p style="color:var(--text-muted);font-size:13.5px;">Senha Redefinida</p>
    </div>

    <!-- Card de Sucesso -->
    <div class="card">
        <div class="card-body" style="padding:32px;text-align:center;">
            <h2 style="font-size:18px;margin-bottom:12px;color:var(--primary-dark);font-family:'Outfit',sans-serif;font-weight:600;">Alteração Concluída!</h2>
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;line-height:1.6;">
                A sua nova senha foi configurada com sucesso. Pode agora iniciar sessão no sistema com as novas credenciais.
            </p>

            <a href="{% url 'login' %}" class="btn-oceano" style="display:inline-flex;width:100%;justify-content:center;padding:13px;font-size:15px;border-radius:6px;text-decoration:none;font-weight:600;font-family:'Inter',sans-serif;">
                <i class="bi bi-box-arrow-in-right" style="margin-right:6px;"></i> Iniciar Sessão
            </a>
        </div>
    </div>

    <div style="text-align:center;margin-top:20px;">
        <p style="font-size:11.5px;color:var(--text-muted);">
            Instituto Nacional de Transportes Marítimos &mdash; Moçambique
        </p>
    </div>
</div>

</body>
</html>
